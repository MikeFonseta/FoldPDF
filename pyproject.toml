[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foldpdf"
version = "1.0.0"
description = "Self-hosted asynchronous REST API that converts DOCX, XLSX and PPTX to PDF with headless LibreOffice"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.18",
    "defusedxml>=0.7.1,<1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MikeFonseta/FoldPDF"
Issues = "https://github.com/MikeFonseta/FoldPDF/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx2>=2.10,<3.0", "httpx>=0.27,<1.0"]

[project.scripts]
foldpdf = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: tests that require a real LibreOffice installation",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]
